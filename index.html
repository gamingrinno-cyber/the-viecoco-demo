      React.useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(''), 2200);
        return () => clearTimeout(timer);
      }, [toast]);

      const totalCart = cart.reduce((sum, item) => sum + item.qty, 0);

      const addToCart = (product) => {
        const exists = cart.find(item => item.product.id === product.id);
        if (exists) {
          setCart(cart.map(item => item.product.id === product.id ? { ...item, qty: item.qty + 1 } : item));
        } else {
          setCart([...cart, { product, qty: 1 }]);
        }
        setToast(`Đã thêm "${product.name}" vào giỏ hàng`);
      };

      const updateQty = (id, qty) => {
        if (qty <= 0) {
          setCart(cart.filter(item => item.product.id !== id));
          return;
        }
        setCart(cart.map(item => item.product.id === id ? { ...item, qty } : item));
      };

        e.preventDefault();
        const form = new FormData(e.target);

        const password = String(form.get('password') || '').trim();

          alert('Email không thuộc quyền quản trị!');
          return;
        }
        if (!password) {
          alert('Vui lòng nhập mật khẩu.');
          return;
        }

        setAdminEmail(email);
        setIsAdminOpen(false);
        setToast('Đăng nhập quản trị thành công');
      };

      const logoutAdmin = () => {
        setAdminEmail('');
        setToast('Đã đăng xuất');
      };

        const exists = products.some(p => p.id === product.id);

          setProducts(products.map(p => p.id === product.id ? product : p));
          setToast('Cập nhật sản phẩm thành công');

          setProducts([product, ...products]);
          setToast('Thêm sản phẩm mới thành công');

        const p = products.find(item => item.id === id);

        if (confirm(`Bạn có chắc muốn xóa "${p.name}"?`)) {

        }

      const shipping = subtotal === 0 || subtotal > 200000 ? 0 : 25000;

                                  const newPrice = Number(e.target.value);
                                  if (!newPrice || newPrice <= 0) return;
                                  setProducts(products.map(p => p.id === product.id ? { ...p, price: newPrice } : p));
                                  setToast(`Đã cập nhật giá sản phẩm "${product.name}"`);
                                }}
                                className="w-full border border-[#4A2E1B]/15 rounded-xl px-3 py-2 text-sm"
                              />
                            </div>
                          ) : (
                            <>
                              <div>
                                <div className="font-serif text-3xl">{formatCurrency(product.price)}</div>
                                {product.originalPrice && (
                                  <div className="text-xs line-through text-[#4A2E1B]/40">{formatCurrency(product.originalPrice)}</div>
                                )}
                              </div>
                            </>
                          )}
                        </div>

                        <div className="mt-6 grid grid-cols-2 gap-3">
                          <button onClick={() => setSelectedProduct(product)} className="border border-[#4A2E1B]/15 bg-[#F7E6CA]/40 text-[#4A2E1B] px-4 py-3 rounded-xl text-xs font-semibold">Chi tiết</button>
                          <button onClick={() => addToCart(product)} className="bg-[#4A2E1B] text-[#FFFCF7] px-4 py-3 rounded-xl text-xs font-bold">Thêm giỏ</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            <section className="py-20 bg-[#FFFCF7]/50">
              <div className="max-w-7xl mx-auto px-4 sm:px-6">
                <div className="text-center mb-12">
                  <div className="inline-block px-3 py-2 rounded-full bg-white border border-[#4A2E1B]/10 text-[10px] uppercase tracking-[0.25em] text-[#7A5230] font-bold">
                    Cảm nhận khách hàng
                  </div>
                  <h2 className="font-serif text-4xl mt-5">Được yêu thích bởi thế hệ trẻ</h2>
                </div>

                <div className="grid md:grid-cols-3 gap-6">
                  {[
                    '“Son dưỡng dừa của The ViéCOCO rất thơm, thoa lên môi mịn màng và không gây khô. Mình rất thích thiết kế hũ thủy tinh sang trọng.”',
                    '“Dùng scrub môi và body dừa, da mình mềm hơn rõ rệt. Mùi rất dịu và không gây kích ứng.”',
                    '“Mình thấy sản phẩm cực phù hợp cho học sinh sinh viên vì an toàn, thơm tự nhiên và rất đáng yêu.”'
                  ].map((text, index) => (
                    <div key={index} className="bg-white border border-[#4A2E1B]/10 rounded-[24px] p-6">
                      <div className="text-[#7A5230] text-xs mb-3">★★★★★</div>
                      <p className="text-[#4A2E1B]/80 italic">"{text}"</p>
                      <div className="mt-6 flex items-center gap-3">
                        <div className="w-10 h-10 rounded-full bg-[#F7E6CA] flex items-center justify-center font-bold">{String.fromCharCode(65 + index)}</div>
                        <div>
                          <div className="font-bold">Khách hàng {index + 1}</div>
                          <div className="text-xs text-[#7A5230]">12A10</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            <section id="contact" className="py-20">
              <div className="max-w-7xl mx-auto px-4 sm:px-6">
                <div className="grid lg:grid-cols-2 gap-10">
                  <div className="bg-[#FFFCF7] rounded-[32px] border border-[#4A2E1B]/10 p-8">
                    <div className="text-[10px] uppercase tracking-[0.25em] text-[#7A5230] font-bold">Liên hệ</div>
                    <h2 className="font-serif text-4xl mt-4">Kết nối với chúng tôi</h2>
                    <div className="mt-6 space-y-5 text-sm">
                      <div className="flex items-start gap-3">
                        <div className="w-10 h-10 rounded-full bg-[#F7E6CA] flex items-center justify-center">📍</div>
                        <div><div className="font-bold">Địa điểm</div><div className="text-[#4A2E1B]/75">Lớp 12A10, trường THPT, Bến Tre</div></div>
                      </div>
                      <div className="flex items-start gap-3">
                        <div className="w-10 h-10 rounded-full bg-[#F7E6CA] flex items-center justify-center">📞</div>
                        <div><div className="font-bold">Hotline</div><div>0988 234 567</div></div>
                      </div>
                      <div className="flex items-start gap-3">
                        <div className="w-10 h-10 rounded-full bg-[#F7E6CA] flex items-center justify-center">🥥</div>
                        <div><div className="font-bold">Mạng xã hội</div><div>@theviecoco.official</div></div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-[#FFFCF7] rounded-[32px] border border-[#4A2E1B]/10 p-8">
                    <form className="space-y-4">
                      <div className="grid md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs uppercase tracking-wider text-[#7A5230] mb-2">Họ tên</label>
                          <input type="text" className="w-full border border-[#4A2E1B]/15 rounded-xl px-4 py-3 bg-[#F7E6CA]/20" />
                        </div>
                        <div>
                          <label className="block text-xs uppercase tracking-wider text-[#7A5230] mb-2">Số điện thoại</label>
                          <input type="tel" className="w-full border border-[#4A2E1B]/15 rounded-xl px-4 py-3 bg-[#F7E6CA]/20" />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs uppercase tracking-wider text-[#7A5230] mb-2">Email</label>
                        <input type="email" className="w-full border border-[#4A2E1B]/15 rounded-xl px-4 py-3 bg-[#F7E6CA]/20" />
                      </div>

                      <div>
                        <label className="block text-xs uppercase tracking-wider text-[#7A5230] mb-2">Lời nhắn</label>
                        <textarea rows="5" className="w-full border border-[#4A2E1B]/15 rounded-xl px-4 py-3 bg-[#F7E6CA]/20"></textarea>
                      </div>

                      <button type="button" className="bg-[#4A2E1B] text-[#FFFCF7] px-6 py-3 rounded-xl font-bold">Gửi tin nhắn</button>
                    </form>
                  </div>
                </div>
              </div>
            </section>
          </main>

          <footer className="bg-[#4A2E1B] text-[#FFFCF7] py-12 mt-8">
            <div className="max-w-7xl mx-auto px-4 sm:px-6">
              <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-6">
                <div>
                  <div className="font-serif text-4xl">The ViéCOCO</div>
                  <div className="font-signature text-3xl text-[#F7E6CA]">Signature: AURACOCO</div>
                </div>

                <div className="text-sm text-[#FFFCF7]/80">
                  Pure Nature - Pure You
                </div>
              </div>

              <div className="mt-8 border-t border-white/10 pt-6 text-sm text-[#FFFCF7]/70 flex flex-col md:flex-row justify-between gap-4">
                <div>© 2026 The ViéCOCO. All rights reserved.</div>
                <div>Nhóm 1 - Tổ 3 • 12A10</div>
              </div>
            </div>
          </footer>

          {selectedProduct && (
            <div className="fixed inset-0 z-50 bg-[#4A2E1B]/60 flex items-center justify-center p-4">
              <div className="bg-[#FFFCF7] rounded-[30px] max-w-3xl w-full p-6 relative">
                <button onClick={() => setSelectedProduct(null)} className="absolute top-4 right-4 w-10 h-10 rounded-full bg-[#F7E6CA] text-[#4A2E1B] font-bold">✕</button>
                <div className="grid md:grid-cols-2 gap-6">
                  <img src={selectedProduct.image} alt={selectedProduct.name} className="w-full h-full object-cover rounded-[24px]" />
                  <div>
                    <div className="inline-block bg-[#F7E6CA] px-2.5 py-1 rounded-full text-[10px] uppercase font-bold text-[#7A5230]">{selectedProduct.tag}</div>
                    <h3 className="font-serif text-4xl mt-4">{selectedProduct.name}</h3>
                    <p className="text-xs italic text-[#7A5230]">{selectedProduct.enName}</p>
                    <div className="mt-4 font-serif text-3xl">{formatCurrency(selectedProduct.price)}</div>
                    <p className="mt-4 text-sm text-[#4A2E1B]/80">{selectedProduct.description}</p>

                    <div className="mt-5">
                      <div className="font-bold text-xs uppercase tracking-wider text-[#7A5230]">Thành phần</div>
                      <ul className="mt-2 text-sm space-y-1">
                        {selectedProduct.ingredients.map((item, i) => (
                          <li key={i}>• {item}</li>
                        ))}
                      </ul>
                    </div>

                    <button onClick={() => addToCart(selectedProduct)} className="mt-6 w-full bg-[#4A2E1B] text-[#FFFCF7] py-3 rounded-xl font-bold">Thêm vào giỏ hàng</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-[#4A2E1B]/60">
              <div className="absolute right-0 top-0 h-full w-full max-w-md bg-[#FFFCF7] shadow-2xl p-6">
                <div className="flex justify-between items-center">
                  <h3 className="font-serif text-3xl">Giỏ hàng</h3>
                  <button onClick={() => setIsCartOpen(false)} className="w-10 h-10 rounded-full bg-[#F7E6CA] text-[#4A2E1B] font-bold">✕</button>
                </div>

                <div className="mt-6 space-y-4">
                  {cart.length === 0 ? (
                    <div className="text-center py-10 text-[#4A2E1B]/70">Giỏ hàng trống.</div>
                  ) : cart.map(item => (
                    <div key={item.product.id} className="flex gap-4 bg-[#F7E6CA]/30 rounded-2xl p-3">
                      <img src={item.product.image} alt={item.product.name} className="w-20 h-20 object-cover rounded-xl" />
                      <div className="flex-1">
                        <div className="font-bold">{item.product.name}</div>
                        <div className="text-xs text-[#7A5230]">{formatCurrency(item.product.price)}</div>
                        <div className="mt-2 flex items-center gap-2">
                          <button onClick={() => updateQty(item.product.id, item.qty - 1)} className="w-7 h-7 rounded-lg bg-white">-</button>
                          <span className="text-sm font-bold">{item.qty}</span>
                          <button onClick={() => updateQty(item.product.id, item.qty + 1)} className="w-7 h-7 rounded-lg bg-white">+</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="mt-8 border-t border-[#4A2E1B]/10 pt-5">
                  <div className="flex justify-between text-sm">
                    <span>Tạm tính</span>
                    <span>{formatCurrency(subtotal)}</span>
                  </div>
                  <div className="flex justify-between text-sm mt-2">
                    <span>Giảm giá</span>
                    <span>-{formatCurrency(discount)}</span>
                  </div>
                  <div className="flex justify-between text-sm mt-2">
                    <span>Phí vận chuyển</span>
                    <span>{shipping === 0 ? 'Miễn phí' : formatCurrency(shipping)}</span>
                  </div>
                  <div className="flex justify-between font-bold text-xl mt-4">
                    <span>Tổng</span>
                    <span>{formatCurrency(total)}</span>
                  </div>
                  <button className="mt-6 w-full bg-[#4A2E1B] text-[#FFFCF7] py-3 rounded-xl font-bold">Tiến hành thanh toán</button>
                </div>
              </div>
            </div>
          )}

          {isAdminOpen && (
            <div className="fixed inset-0 z-50 bg-[#4A2E1B]/60 flex items-center justify-center p-4">
              <div className="bg-[#FFFCF7] w-full max-w-md rounded-[28px] p-6 relative">
                <button onClick={() => setIsAdminOpen(false)} className="absolute top-4 right-4 w-10 h-10 rounded-full bg-[#F7E6CA]">✕</button>
                <div className="text-center">
                  <div className="text-3xl mb-2">🔐</div>
                  <h3 className="font-serif text-3xl">Đăng nhập Admin</h3>
                </div>

                <form onSubmit={adminLogin} className="mt-6 space-y-4">
                  <div>
                    <label className="block text-xs uppercase tracking-wider text-[#7A5230] mb-2">Email</label>
                    <input name="email" type="email" className="w-full border border-[#4A2E1B]/15 rounded-xl px-4 py-3 bg-[#F7E6CA]/20" />
                  </div>
                  <div>
                    <label className="block text-xs uppercase tracking-wider text-[#7A5230] mb-2">Mật khẩu</label>
                    <input name="password" type="password" className="w-full border border-[#4A2E1B]/15 rounded-xl px-4 py-3 bg-[#F7E6CA]/20" />
                  </div>
                  <button type="submit" className="w-full bg-[#4A2E1B] text-[#FFFCF7] py-3 rounded-xl font-bold">Xác thực</button>
                </form>
              </div>
            </div>
          )}

          {editingProduct && (
            <div className="fixed inset-0 z-50 bg-[#4A2E1B]/60 flex items-center justify-center p-4">
              <div className="bg-[#FFFCF7] rounded-[28px] p-6 w-full max-w-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="font-serif text-3xl">{editingProduct.id ? 'Sửa sản phẩm' : 'Thêm sản phẩm mới'}</h3>
                  <button onClick={() => setEditingProduct(null)} className="w-10 h-10 rounded-full bg-[#F7E6CA]">✕</button>
                </div>

                <div className="mt-6 grid md:grid-cols-2 gap-4">
                  <input value={editingProduct.name} onChange={(e) => setEditingProduct({ ...editingProduct, name: e.target.value })} placeholder="Tên sản phẩm" className="border rounded-xl px-4 py-3" />
                  <input value={editingProduct.enName} onChange={(e) => setEditingProduct({ ...editingProduct, enName: e.target.value })} placeholder="Tên tiếng Anh" className="border rounded-xl px-4 py-3" />
                  <input value={editingProduct.price} onChange={(e) => setEditingProduct({ ...editingProduct, price: Number(e.target.value) })} placeholder="Giá" type="number" className="border rounded-xl px-4 py-3" />
                  <input value={editingProduct.originalPrice} onChange={(e) => setEditingProduct({ ...editingProduct, originalPrice: Number(e.target.value) })} placeholder="Giá gốc" type="number" className="border rounded-xl px-4 py-3" />
                  <input value={editingProduct.volume} onChange={(e) => setEditingProduct({ ...editingProduct, volume: e.target.value })} placeholder="Dung tích" className="border rounded-xl px-4 py-3" />
                  <input value={editingProduct.tag} onChange={(e) => setEditingProduct({ ...editingProduct, tag: e.target.value })} placeholder="Tag" className="border rounded-xl px-4 py-3" />
                  <input value={editingProduct.image} onChange={(e) => setEditingProduct({ ...editingProduct, image: e.target.value })} placeholder="Link ảnh" className="md:col-span-2 border rounded-xl px-4 py-3" />
                  <textarea value={editingProduct.shortDesc} onChange={(e) => setEditingProduct({ ...editingProduct, shortDesc: e.target.value })} placeholder="Mô tả ngắn" rows="3" className="md:col-span-2 border rounded-xl px-4 py-3"></textarea>
                  <textarea value={editingProduct.description} onChange={(e) => setEditingProduct({ ...editingProduct, description: e.target.value })} placeholder="Mô tả chi tiết" rows="4" className="md:col-span-2 border rounded-xl px-4 py-3"></textarea>
                </div>

                <div className="mt-6 flex justify-end gap-3">
                  <button onClick={() => setEditingProduct(null)} className="px-5 py-3 rounded-xl border border-[#4A2E1B]/20">Hủy</button>
                  <button
                    onClick={() => {
                      const product = {
                        ...editingProduct,
                        ingredients: editingProduct.ingredients || ['Dầu dừa', 'Dưỡng chất thiên nhiên'],
                        reviewCount: editingProduct.reviewCount || 99,
                        rating: editingProduct.rating || 4.9
                      };
                      saveProduct(product);
                      setEditingProduct(null);
                    }}
                    className="bg-[#4A2E1B] text-[#FFFCF7] px-5 py-3 rounded-xl font-bold"
                  >
                    Lưu
                  </button>
                </div>
              </div>
            </div>
          )}

          {toast && (
            <div className="fixed bottom-6 right-6 z-[80] bg-[#4A2E1B] text-[#FFFCF7] rounded-2xl px-4 py-3 shadow-2xl text-sm">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
